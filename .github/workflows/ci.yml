name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rule 11 is enforced by a machine, not by good intentions.
  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No real .env file is tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|staging)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A real .env file is committed:"
            echo "$tracked"
            echo "Secrets live only in the platform secret store (Rule 11)."
            exit 1
          fi
          echo "OK — no tracked .env files."

      - name: No non-empty secret values in .env.example
        run: |
          set -euo pipefail
          # .env.example may declare secret keys, but they must be empty.
          bad=$(grep -nE '^(ASKBOTS_API_KEY|BUY_WALLET_PRIVATE_KEY|CENCORI_API_KEY|ATTRIBUTION_TAG)=.+' .env.example || true)
          if [ -n "$bad" ]; then
            echo "::error::.env.example has a non-empty secret value:"
            echo "$bad"
            exit 1
          fi
          echo "OK — .env.example declares no secret values."

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The lockfile may not exist yet on the very first run. Prefer `npm ci`
      # (reproducible) and fall back to `npm install` until it does.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # Each workspace is typechecked separately rather than through the root
      # `npm run typecheck`, for two reasons: npm aborts a --workspaces run at
      # the first failing package, so a single error in shared-types would hide
      # every error in web and worker; and the output goes to stdout as well as
      # to the log file, which is what lets GitHub surface each `error TS...`
      # line as an annotation on the commit.
      - name: Typecheck
        run: |
          set -o pipefail
          : > typecheck.log
          failed=0
          for workspace in @observed/shared-types @observed/web @observed/worker; do
            echo "=== $workspace ===" | tee -a typecheck.log
            npm run typecheck --workspace "$workspace" 2>&1 | tee -a typecheck.log || failed=1
          done

          # Downloading job logs needs admin rights on the repo; reading check-run
          # annotations does not. Re-emitting each compiler error as an
          # `::error::` workflow command is what makes a failure diagnosable
          # without a token. Capped at 20 lines — the UI shows only the first few
          # anyway, and typecheck.log still holds the whole thing.
          grep -E 'error TS[0-9]+' typecheck.log \
            | head -20 \
            | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

          exit $failed

      - name: Publish typecheck output
        if: always()
        run: |
          {
            echo '## Typecheck output'
            echo ''
            echo '```'
            # Capped: a runaway error list should not make the summary unreadable.
            tail -c 200000 typecheck.log 2>/dev/null || echo '(no typecheck.log was produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The repository had no tests at all until this step. The gap it closes is
      # specific: the collectors had a way to run and the review loop did not, so
      # "the review is correct" was a claim only a CI annotation could support,
      # and only for the one target it happened to run against.
      #
      # These tests are mostly NEGATIVE — they assert that a particular sentence
      # is absent from the output. That is the shape the risk takes here: a bug
      # in this code does not throw, it publishes a confident, cited, false
      # sentence about somebody else's project.
      #
      # Test failures are re-emitted as annotations for the same reason the
      # compiler errors are: job logs need admin rights and annotations do not.
      - name: Test
        run: |
          set -o pipefail
          # The failure is CAPTURED, not propagated. The default shell here is
          # `bash -e`, so a bare failing command ends the step immediately and the
          # annotation grep below would never run — leaving the only readable
          # failure signal unemitted, in precisely the case it exists for. The
          # typecheck step above captures the same way, for the same reason.
          failed=0
          npm test --workspaces --if-present 2>&1 | tee test.log || failed=1

          grep -E '^(not ok|# fail)' test.log | head -20 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

          exit $failed

      - name: Publish test output
        if: always()
        run: |
          {
            echo '## Test output'
            echo ''
            echo '```'
            tail -c 100000 test.log 2>/dev/null || echo '(no test.log was produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      # This has to ask git, not the filesystem.
      #
      # It originally read `if: ${{ hashFiles('package-lock.json') == '' }}`, and
      # that step could never fire: it runs *after* the `npm install` above, which
      # has already written a package-lock.json into the working tree, so the file
      # always "exists" and the step is skipped on every run. A skipped reminder
      # reads as "the lockfile is committed", which is the opposite of the truth —
      # nothing is committed until someone commits it. The condition was asking
      # about the wrong thing: the question is what is *in the repo*, not what
      # happens to be on disk after an install.
      - name: Report on the lockfile
        run: |
          if [ -z "$(git ls-files package-lock.json)" ]; then
            echo "::notice::No package-lock.json is committed, so installs take the 'npm install' branch and are not reproducible. Committing one switches CI to 'npm ci' automatically. Vercel produces one on first deploy, which is the cheapest route."
          else
            echo "OK — package-lock.json is committed; CI uses 'npm ci'."
          fi

  # The only job that EXECUTES the worker rather than compiling it.
  #
  # This exists because of the most uncomfortable line in PROGRESS.md: every
  # collector was called "complete" and not one had ever been run. The fetcher
  # had a bug that made it send nothing at all, so the HTML collector could
  # never have observed anything — and it survived three sessions because the
  # type checker cannot see a missing `request.end()`.
  #
  # It observes the hackathon's own site, which is a real target, publicly
  # reachable, and stable for the life of the event.
  #
  # The exit code is the interesting part. A target that cannot be reached
  # produces an `unknown_*` artifact and exits 0 — that is the tri-state
  # working, not a failure. A non-zero exit means OUR code threw, which is
  # precisely the class of bug this job is here to catch.
  observe:
    name: Observe a real target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run one real observation
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/observed"
          # An absolute path, deliberately. A bare `--out observed/run.json` is
          # resolved against the process's cwd, and under `npm run --workspace`
          # that is `apps/worker` — not the repo root. The first run of this job
          # died with ENOENT on exactly that mismatch, after doing the whole
          # observation successfully, and the upload step silently found nothing
          # for the same reason.
          npm run observe --workspace @observed/worker -- \
            https://celobuilders.xyz \
            --repo https://github.com/Temmygabriel/OBSERVED \
            --out "$GITHUB_WORKSPACE/observed/run.json" 2>&1 | tee observe.log

      # Rule 5 is the rule that says this reviewer must never review its own
      # entry, and until this step existed it had a tested mechanism and NO
      # CALLER — so "the exclusion list is configured" was an assertion about a
      # file rather than a fact about the running system.
      #
      # This points the real CLI at the operator's own repository with the
      # operator's own identifiers in the list, and requires the refusal. It is
      # the only target in the world this reviewer is forbidden to look at, so
      # it is the only target that can demonstrate the rule.
      #
      # Note what this exposes, because it is worth being honest about rather
      # than hoping nobody notices: the observation step ABOVE passes
      # `--repo https://github.com/Temmygabriel/OBSERVED`, which is the
      # operator's own project. That step is a diagnostic — it proves the
      # collectors reach the network and produce artifacts — and it is why
      # EXCLUSION_LIST is deliberately NOT set on it. If it were set there, this
      # refusal is exactly what would happen to the whole flagship job, which is
      # the rule working correctly. A review of that repository must never be
      # published; an observation of it, in CI, to prove the plumbing, is a
      # different act and is not submitted to anyone.
      - name: Prove Rule 5 refuses our own entry
        run: |
          set -o pipefail
          # No apostrophes anywhere in these reasons, deliberately. This JSON
          # lives inside a bash single-quoted string, and inside single quotes an
          # apostrophe cannot be escaped — `''` ends the string and starts a new
          # one, so the character silently disappears and the reason reads
          # "Observeds own operator". A wrong string that still parses is worse
          # than a syntax error, so the wording avoids the character entirely.
          #
          # The list is inline rather than a repository secret so that a judge
          # can read exactly what is being excluded and confirm the check is
          # aimed at something real. These are all public identifiers.
          export EXCLUSION_LIST='[
            {"type":"github_owner","value":"Temmygabriel","reason":"the GitHub account that operates Observed"},
            {"type":"telegram_handle","value":"temmygabriel","reason":"the Telegram handle registered for Observed"},
            {"type":"erc8004_agent_id","value":"9849","reason":"the ERC-8004 identity minted by Observed"},
            {"type":"wallet_address","value":"0x556Ff7dD2bE1B504495288295Ad7cc3d414dd2c0","reason":"the agent wallet used by Observed"}
          ]'

          npm run observe --workspace @observed/worker -- \
            https://github.com/Temmygabriel/OBSERVED \
            --repo https://github.com/Temmygabriel/OBSERVED \
            --out "$GITHUB_WORKSPACE/observed/excluded.json" 2>&1 | tee excluded.log

          # The assertion is on the refusal, and it is a positive one. A step
          # that only checked the exit code would pass just as happily if the
          # CLI had crashed before reaching the check — and "it refused" and "it
          # died" are the two outcomes that must never be confused here.
          if ! grep -q '::notice::excluded:' excluded.log; then
            echo "::error::Rule 5 did not refuse the operator's own project. The exclusion list is not being enforced, which means the reviewer would review its own entry."
            exit 1
          fi
          echo "OK — Rule 5 refused the operator's own project before collecting anything."

      # Annotations are the ONLY channel readable without admin rights on the
      # repo — the step summary and the uploaded bundle both require a token, and
      # the job log requires admin. So the evidence this job just produced is
      # re-emitted as workflow commands, which come back as annotations on the
      # commit. Without this, "the collectors ran" is a sentence in a document;
      # with it, every artifact's status, URL, status code and final URL are on
      # the commit where anyone can read them.
      #
      # The script arrives on stdin through a QUOTED heredoc, not as
      # `node -e '...'`. That is not style. Shell single-quoting means one
      # apostrophe anywhere in the script — including inside a comment —
      # terminates the string early, and the step then dies with a SyntaxError on
      # stderr, which is precisely the unreadable failure this whole step exists
      # to eliminate. It happened on this step's first outing: a comment reading
      # "the page's href" broke it, and the run reported nothing but a red X. With
      # a quoted delimiter, apostrophes, backticks and `$` are all literal.
      #
      # The top-level catch is the other half of that lesson: a reporter that
      # cannot report its own failure is worth nothing, so this one emits an
      # `::error::` naming the exception rather than exiting quietly.
      - name: Re-emit the artifacts as annotations
        if: always()
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require("node:fs");

          // One place that writes a workflow command, so a message can never
          // carry a raw newline into it: a command's parameters run to the end
          // of the line, so an embedded newline silently swallows the rest and
          // the annotation is truncated with no sign that anything was lost.
          const say = (level, message) => {
            const flat = String(message).replace(/\r?\n/g, " ").replace(/%/g, "%25");
            console.log("::" + level + "::" + flat);
          };

          try {
            let run;
            try {
              run = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + "/observed/run.json", "utf8"));
            } catch {
              say("warning", "no observation bundle was written — the run failed before it could report");
              process.exit(0);
            }

            const artifacts = run.artifacts ?? [];
            const skipped = run.skipped ?? [];
            const show = (value) => {
              const flat = (Array.isArray(value) ? value.join("|") : String(value)).replace(/\r?\n/g, " ");
              return flat.length > 90 ? flat.slice(0, 90) + "..." : flat;
            };

            say("notice", "observation produced " + artifacts.length + " artifact(s); " + skipped.length + " collector(s) skipped");

            for (const a of artifacts.slice(0, 20)) {
              const m = a.metadata ?? {};
              // unknown_* is a legitimate statement about the target, not a
              // defect — the same distinction the exit code makes. It warns; it
              // does not fail.
              const level = String(a.status).startsWith("unknown_") ? "warning" : "notice";
              // target_url is the URL actually probed, and it is what makes a
              // link result attributable. Without it the four link artifacts are
              // four statuses attached to nothing, and a link result that cannot
              // be traced to a link is not citable.
              const bits = [a.collector + "/" + a.artifact_id, a.status, "url=" + show(a.target_url)];
              // The address the socket connected to, and the URL it ended on.
              // These two are what distinguish "the page moved" from "the domain
              // has several addresses" — without both, an address that differs
              // from the DNS answer is unreadable, which is exactly the question
              // the first annotated run left open.
              if (a.resolved_ip != null) bits.push("ip=" + a.resolved_ip);
              for (const key of ["status_code", "content_type", "final_url", "href", "redirect_count", "addresses", "refusal", "error"]) {
                if (m[key] !== undefined && m[key] !== null) bits.push(key + "=" + show(m[key]));
              }
              say(level, bits.join(" "));
            }

            for (const s of skipped) say("notice", "skipped " + s.collector + ": " + s.reason);
          } catch (error) {
            say("error", "annotation step failed: " + (error && error.stack ? error.stack : error));
            process.exit(1);
          }
          NODE

      # The step the whole project is for.
      #
      # Everything above proves the collectors ran. None of it says anything
      # about the product, because the product is the REVIEW — and until this
      # step existed, no review could be produced anywhere, by any route: the
      # drafting step threw unconditionally, so the pipeline terminated in a
      # throw and the sentences that are the entire deliverable did not exist.
      #
      # So this drafts from the bundle the observation just wrote, runs the
      # claims through the same validator the app uses, and emits the rendered
      # text as a notice. The review is then readable on the commit by anyone,
      # with no token and no admin rights, which is the same constraint that
      # shaped the annotation step above.
      #
      # `if: always()` because a bundle worth drafting from may exist even when
      # the observation step failed late. The guard is on the file, not the
      # previous step's conclusion.
      #
      # `set -o pipefail` matters here: a non-zero exit means the validator
      # refused a claim the drafter built from a collected artifact, which
      # cannot happen unless the drafter is wrong. That is a real bug and it
      # should turn the job red rather than scroll past in a log nobody can read.
      - name: Draft the review from that observation
        if: always()
        run: |
          set -o pipefail
          if [ -f "$GITHUB_WORKSPACE/observed/run.json" ]; then
            npm run draft --workspace @observed/worker -- \
              "$GITHUB_WORKSPACE/observed/run.json" 2>&1 | tee draft.log
          else
            echo "::warning::no observation bundle was written, so there was nothing to draft from"
          fi

      - name: Publish the observation
        if: always()
        run: |
          {
            echo '## Real observation'
            echo ''
            echo 'Produced by executing the collectors, not by compiling them.'
            echo ''
            echo '```'
            tail -c 100000 observe.log 2>/dev/null || echo '(no output was produced)'
            echo '```'
            echo ''
            echo '## Review drafted from that observation'
            echo ''
            echo 'Rendered from the validated claim record, not written freely.'
            echo ''
            echo '```'
            tail -c 100000 draft.log 2>/dev/null || echo '(no draft was produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation
          path: |
            observed/run.json
            observe.log
            draft.log
          if-no-files-found: warn
