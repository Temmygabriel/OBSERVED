name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rule 11 is enforced by a machine, not by good intentions.
  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No real .env file is tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|staging)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A real .env file is committed:"
            echo "$tracked"
            echo "Secrets live only in the platform secret store (Rule 11)."
            exit 1
          fi
          echo "OK — no tracked .env files."

      - name: No non-empty secret values in .env.example
        run: |
          set -euo pipefail
          # .env.example may declare secret keys, but they must be empty.
          bad=$(grep -nE '^(ASKBOTS_API_KEY|BUY_WALLET_PRIVATE_KEY|CENCORI_API_KEY|ATTRIBUTION_TAG)=.+' .env.example || true)
          if [ -n "$bad" ]; then
            echo "::error::.env.example has a non-empty secret value:"
            echo "$bad"
            exit 1
          fi
          echo "OK — .env.example declares no secret values."

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The lockfile may not exist yet on the very first run. Prefer `npm ci`
      # (reproducible) and fall back to `npm install` until it does.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # Each workspace is typechecked separately rather than through the root
      # `npm run typecheck`, for two reasons: npm aborts a --workspaces run at
      # the first failing package, so a single error in shared-types would hide
      # every error in web and worker; and the output goes to stdout as well as
      # to the log file, which is what lets GitHub surface each `error TS...`
      # line as an annotation on the commit.
      - name: Typecheck
        run: |
          set -o pipefail
          : > typecheck.log
          failed=0
          for workspace in @observed/shared-types @observed/web @observed/worker; do
            echo "=== $workspace ===" | tee -a typecheck.log
            npm run typecheck --workspace "$workspace" 2>&1 | tee -a typecheck.log || failed=1
          done

          # Downloading job logs needs admin rights on the repo; reading check-run
          # annotations does not. Re-emitting each compiler error as an
          # `::error::` workflow command is what makes a failure diagnosable
          # without a token. Capped at 20 lines — the UI shows only the first few
          # anyway, and typecheck.log still holds the whole thing.
          grep -E 'error TS[0-9]+' typecheck.log \
            | head -20 \
            | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

          exit $failed

      - name: Publish typecheck output
        if: always()
        run: |
          {
            echo '## Typecheck output'
            echo ''
            echo '```'
            # Capped: a runaway error list should not make the summary unreadable.
            tail -c 200000 typecheck.log 2>/dev/null || echo '(no typecheck.log was produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Remind about the lockfile
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          echo "::notice::No package-lock.json yet. Once one is committed, CI switches to 'npm ci' automatically."
